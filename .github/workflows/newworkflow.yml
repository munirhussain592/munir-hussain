name: CI/CD Pipeline

# 1. Define what triggers the pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 2. Define the execution blocks
jobs:
  # The Continuous Integration (CI) job
  build-and-test:
    runs-on: ubuntu-latest # Uses a GitHub-hosted Linux runner
    
    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up your environment (Example: Node.js)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run automated tests
      - name: Run tests
        run: npm test

  # The Continuous Deployment (CD) job
  deploy:
    needs: build-and-test # Only runs if the testing job passes successfully
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy application
        run: echo "Deploying your application to the server..."
